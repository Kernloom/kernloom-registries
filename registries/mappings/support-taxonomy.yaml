apiVersion: kernloom.io/registry/v1alpha1
kind: SupportTaxonomy
metadata:
  name: kernloom-support-taxonomy
  version: "0.2.0"
spec:
  supportLevels:
    - id: full
      deployable: true
      requiresApproval: false
      description: Adapter capability natively and fully enforces the requirement.
    - id: partial
      deployable: true
      requiresApproval: true
      description: Adapter approximates the requirement with reduced semantic fidelity.
    - id: delegated
      deployable: true
      requiresApproval: true
      description: Vendor PDP evaluates a semantically equivalent condition natively.
    - id: compensating_control
      deployable: true
      requiresApproval: false
      description: Kernloom compensates for a target gap with a restrictive runtime action.
    - id: unsupported
      deployable: false
      requiresApproval: false
      description: No declared mapping can satisfy the requirement for this target.
  fidelityLevels:
    - id: high
      description: Canonical semantics are preserved.
    - id: medium
      description: Usable semantic approximation; portability is reduced.
    - id: low
      description: Major downgrade requiring explicit operator approval.
    - id: none
      description: Requirement is not implemented.
  strictnessModes:
    - strict
    - allow_partial_with_approval
    - observe_only
    - vendor_delegation_allowed
  delegationOwners:
    - runtime_context_owner
    - risk_assessment_owner
    - runtime_decision_owner
    - enforcement_owner
    - durable_config_owner
